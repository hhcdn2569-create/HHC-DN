<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูล HHC - กลุ่มงานพยาบาลชุมชน</title>
    <style>
        :root { --primary-color: #0d6efd; --bg-color: #f4f6fa; --text-color: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-color); padding-bottom: 70px; }
        .app-container { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-item { background: none; border: none; flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; color: #8e8e93; cursor: pointer; gap: 4px; }
        .nav-item.active { color: #009688; font-weight: bold; }
        .nav-icon { font-size: 1.3rem; }
        .page { display: none; padding: 20px; box-sizing: border-box; }
        .page.active { display: block; }
        .header-title { font-size: 1.25rem; font-weight: bold; color: #212529; margin: 5px 0; }
        .header-sub { font-size: 0.85rem; color: #6c757d; margin: 0 0 20px 0; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; color: #495057; }
        input[type="text"], input[type="date"], select, textarea { width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 10px; box-sizing: border-box; font-size: 0.95rem; background-color: #fff; }
        .upload-dashed { border: 2px dashed #ced4da; border-radius: 12px; padding: 25px 15px; text-align: center; cursor: pointer; background: #fafafa; }
        .submit-btn { width: 100%; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .stat-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 10px; }
        .stat-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 14px; padding: 16px; }
        .progress-circle { width: 90px; height: 90px; border-radius: 50%; background: conic-gradient(#009688 94.2%, #e9ecef 0); display: flex; align-items: center; justify-content: center; margin: 15px auto; position: relative; }
        .progress-circle::after { content: "94.2%"; position: absolute; width: 74px; height: 74px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .history-card { background: #ffffff; border: 1px solid #edf2f7; border-radius: 12px; padding: 14px; margin-bottom: 12px; border-left: 4px solid #009688; }
        .history-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: #adb5bd; }
        .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; background: #e0f2f1; color: #00796b; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 🌟 หน้าที่ 1: บันทึกข้อมูล HHC -->
    <div id="page-form" class="page active">
        <div class="header-title">ระบบบันทึกข้อมูล HHC (กลุ่มงานพยาบาลชุมชน)</div>
        <div class="header-sub">Home Health Care Data Entry</div>
        
        <form action="https://script.google.com/macros/s/AKfycbw69p5l86H5hNbxXoARnr5zhFw8YNuMMOc6w7JPPmfewO3A1CEIG1v6lmxRpV8huKIV/exec" method="POST" id="hhcForm">
            <div class="form-group">
                <label>วันที่รับบริการ</label>
                <input type="date" id="serviceDate" name="serviceDate" required>
            </div>
            <div class="form-group">
                <label>เลขที่บัตรผู้ป่วย (HN)</label>
                <input type="text" id="hn" name="hn" placeholder="เช่น 66000123" required>
            </div>
            <div class="form-group">
                <label>หน่วยงาน/แผนก</label>
                <select id="department" name="department" required>
                    <option value="">เลือกหน่วยงาน</option>
                    <option value="อายุรกรรม">อายุรกรรม</option>
                    <option value="โรคหัวใจ">โรคหัวใจ</option>
                    <option value="ระบบประสาท">ระบบประสาท</option>
                    <option value="ศัลยกรรมกระดูก">ศัลยกรรมกระดูก</option>
                </select>
            </div>
            <div class="form-group">
                <label>คำวินิจฉัย (Diagnosis)</label>
                <textarea id="diagnosis" name="diagnosis" rows="4" placeholder="ระบุรายละเอียดอาการและการวินิจฉัย..." required></textarea>
            </div>
            <div class="form-group">
                <label>แนบรูปภาพประกอบ</label>
                <div class="upload-dashed" onclick="document.getElementById('imageFile').click()">
                    <span id="uploadText">📷 คลิกเพื่อจำลองการอัปโหลดรูปภาพ</span>
                    <input type="file" id="imageFile" name="image" accept="image/*" style="display: none;">
                </div>
            </div>
            <button type="submit" class="submit-btn">💾 บันทึกข้อมูลเข้า Google Sheet</button>
        </form>
    </div>

    <!-- 🌟 หน้าที่ 2: แดชบอร์ด -->
    <div id="page-dashboard" class="page">
        <div class="header-title">แดชบอร์ดสรุปผล</div>
        <div class="header-sub">ภาพรวมการทำงานในระบบพยาบาลชุมชน</div>
        <div class="stat-grid">
            <div class="stat-card">
                <div style="color: #6c757d; font-size: 0.85rem;">เคสทั้งหมดวันนี้</div>
                <div style="font-size: 2rem; font-weight: bold;">664</div>
            </div>
            <div class="stat-card" style="text-align: center;">
                <div style="color: #6c757d; font-size: 0.85rem;">อัตราการทำงานสำเร็จ</div>
                <div class="progress-circle"></div>
            </div>
        </div>
    </div>

    <!-- 🌟 หน้าที่ 3: ประวัติ -->
    <div id="page-history" class="page">
        <div class="header-title">ประวัติการบันทึก HHC</div>
        <div class="header-sub">รายการตรวจสอบข้อมูลย้อนหลัง</div>
        <div class="history-card">
            <div class="history-meta"><span>24 พ.ค. 2026 - 14:30</span><span style="color:#009688;">● สำเร็จ</span></div>
            <div style="font-weight: bold; margin: 5px 0;">HN: 65-XXXXXX</div>
            <span class="tag">อายุรกรรม</span>
        </div>
    </div>

    <!-- เมนูบาร์ด้านล่างเพื่อสลับหน้าจอ -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('page-form', this)"><span>📝 บันทึก</span></button>
        <button class="nav-item" onclick="switchPage('page-dashboard', this)"><span>📊 แดชบอร์ด</span></button>
        <button class="nav-item" onclick="switchPage('page-history', this)"><span>⏳ ประวัติ</span></button>
    </nav>
</div>

<script>
    document.getElementById('serviceDate').valueAsDate = new Date();
    function switchPage(pageId, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        element.classList.add('active');
    }
    document.getElementById('imageFile').addEventListener('change', function(e) {
        if(e.target.files.length > 0) document.getElementById('uploadText').innerText = '✔️ เลือกไฟล์สำเร็จ: ' + e.target.files[0].name;
    });
</script>
</body>
</html>
