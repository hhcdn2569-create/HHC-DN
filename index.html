<!-- บันทึกข้อมูล HHC (3-Menu Navigation) -->
<!DOCTYPE html>
<html class="light" lang="th">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>ระบบบันทึกข้อมูล HHC - สมเด็จพระสังฆราช</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a", "on-tertiary-fixed": "#121e1c", "on-tertiary": "#ffffff", "primary-fixed": "#d6e3ff", "inverse-on-surface": "#eaf1ff", "on-primary-fixed": "#001b3d", "on-error": "#ffffff", "surface": "#f8f9ff", "background": "#f8f9ff", "surface-container-highest": "#d3e4fe", "on-primary": "#ffffff", "on-secondary-fixed": "#002020", "surface-dim": "#cbdbf5", "on-tertiary-fixed-variant": "#3d4947", "surface-variant": "#d3e4fe", "tertiary-container": "#33403e", "surface-container-low": "#eff4ff", "primary-container": "#1b3d6d", "error-container": "#ffdad6", "surface-container-high": "#dce9ff", "surface-tint": "#405f91", "secondary-fixed-dim": "#6fd7d6", "on-secondary": "#ffffff", "secondary-container": "#8cf3f3", "on-primary-container": "#8aa9e0", "on-surface": "#0b1c30", "on-secondary-fixed-variant": "#004f4f", "tertiary-fixed-dim": "#bcc9c7", "outline": "#747780", "on-tertiary-container": "#9eaba9", "on-secondary-container": "#007070", "surface-container": "#e5eeff", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#264777", "tertiary-fixed": "#d7e5e2", "on-surface-variant": "#43474f", "inverse-surface": "#213145", "primary-fixed-dim": "#a9c7ff", "inverse-primary": "#a9c7ff", "primary": "#002753", "outline-variant": "#c4c6d0", "surface-bright": "#f8f9ff", "tertiary": "#1e2a28", "secondary": "#006a6a", "on-background": "#0b1c30", "error": "#ba1a1a", "secondary-fixed": "#8cf3f3"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "fontFamily": { "body-lg": ["Public Sans"], "label-sm": ["Public Sans"], "body-md": ["Public Sans"], "headline-lg-mobile": ["Manrope"], "headline-md": ["Manrope"], "headline-lg": ["Manrope"], "headline-xl": ["Manrope"], "label-md": ["Public Sans"] },
                    "fontSize": { "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}], "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}], "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}], "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}], "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}], "headline-xl": ["40px", {"lineHeight": "48px", "fontWeight": "700"}], "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}] }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .form-input-focus:focus { outline: none; border-color: #002753; box-shadow: 0 0 0 1px #002753; }
        body { background-color: #f8f9ff; color: #0b1c30; }
        .page-content { display: none; }
        .page-content.active { display: block; }
    </style>
</head>
<body class="font-body-md text-body-md mb-20 md:mb-0 md:pt-16">

    <!-- ส่วนหัว TopAppBar (คงเดิมตามดีไซน์ Stitch) -->
    <header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex items-center justify-between px-margin-mobile h-16">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
                <img alt="Hospital Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGchRZxpezkxRytbeAehlkXD-w9XqjcrBUZNgA5aZRiAC3oR5HAiXxzQeV4iDezoe7DRRFe6-kTGHIYeRe-kJDnQ6c8XRnekRiKYzY5nSVw5RBnf3u2YIt_-zrcCm9JQlH84bV_p2MhnwuuqwOlBlHfA32olfnz58hah6cVafgYDy91PuT1T1f3BOz9aja50-arxdqVwm-HDZzgZk3zCnXXJtA4R0bDOmtZstyRYXXWXfy5QkmoyMfISBtjF82T82c6YCzeE7WwK4"/>
            </div>
            <div class="flex flex-col">
                <h1 class="font-headline-md text-[18px] font-bold text-primary leading-tight">กลุ่มงานพยาบาลชุมชน</h1>
                <p class="text-[12px] text-on-surface-variant font-medium leading-tight">โรงพยาบาลสมเด็จพระสังฆราช (อมฺพรมหาเถร)</p>
            </div>
        </div>
        <button class="material-symbols-outlined text-primary p-2 hover:bg-surface-container-high rounded-full">account_circle</button>
    </header>

    <main class="max-w-[800px] mx-auto px-margin-mobile py-8 mt-16">

        <!-- 📑 หน้าที่ 1: บันทึกข้อมูล (Form) -->
        <div id="view-form" class="page-content active">
            <div class="mb-8">
                <h2 class="font-headline-lg-mobile text-primary mb-2">ระบบบันทึกข้อมูล HHC</h2>
                <p class="text-on-surface-variant font-body-md">Home Health Care Data Entry</p>
            </div>

            <!-- ชี้เป้าไปที่ Google Web App ของพี่พีทตรงๆ -->
            <form class="space-y-6 bg-surface-container-lowest p-6 rounded-xl shadow-md" id="hhc-form" action="https://script.google.com/macros/s/AKfycbw69p5l86H5hNbxXoARnr5zhFw8YNuMMOc6w7JPPmfewO3A1CEIG1v6lmxRpV8huKIV/exec" method="POST">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-2">
                        <label class="font-label-md text-on-surface" for="visit-date">วันที่รับบริการ</label>
                        <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus" id="visit-date" name="serviceDate" required type="date"/>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="font-label-md text-on-surface" for="hn-number">เลขที่บัตรผู้ป่วย (HN)</label>
                        <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus" id="hn-number" name="hn" placeholder="เช่น 66000123" required type="text"/>
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-label-md text-on-surface" for="department">หน่วยงาน/แผนก</label>
                    <select class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus cursor-pointer" id="department" name="department" onchange="toggleOther(this.value)" required>
                        <option disabled selected value="">เลือกหน่วยงาน</option>
                        <option value="ER">ER</option><option value="OPD">OPD</option><option value="ICU">ICU</option>
                        <option value="กุมาร">กุมาร</option><option value="ORT">ORT</option><option value="ศัลยกรรม">ศัลยกรรม</option>
                        <option value="นรีเวช">นรีเวช</option><option value="จักษุ">จักษุ</option><option value="Stroke">Stroke</option>
                        <option value="ฉ.2">ฉ.2</option><option value="ฉ.3">ฉ.3</option><option value="ฉ.4">ฉ.4</option>
                        <option value="ฉ.5">ฉ.5</option><option value="ฉ.6">ฉ.6</option><option value="ฉ.7">ฉ.7</option>
                        <option value="อายุรกรรม (ชาย)">อายุรกรรม (ชาย)</option><option value="อายุรกรรม (หญิง)">อายุรกรรม (หญิง)</option>
                        <option value="อื่นๆ">อื่นๆ (ระบุเพิ่มเติม)</option>
                    </select>
                </div>

                <div class="hidden flex flex-col gap-2" id="other-dept-container">
                    <label class="font-label-md text-on-surface" for="other-dept">ระบุแผนกเพิ่มเติม</label>
                    <input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus" id="other-dept" placeholder="ระบุชื่อแผนก">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-label-md text-on-surface" for="diagnosis">คำวินิจฉัย (Diagnosis)</label>
                    <textarea class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-bright form-input-focus" id="diagnosis" name="diagnosis" rows="4" placeholder="ระบุรายละเอียดการวินิจฉัย..." required></textarea>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-label-md text-on-surface">แนบรูปภาพประกอบ</label>
                    <div class="border-2 border-dashed border-outline-variant rounded-lg padding py-6 text-center cursor-pointer bg-surface-bright" onclick="document.getElementById('image-file').click()">
                        <span class="material-symbols-outlined text-secondary text-3xl mb-1">add_a_photo</span>
                        <p class="text-sm text-on-surface-variant" id="upload-label">คลิกเพื่อเลือกรูปภาพประกอบ</p>
                        <input type="file" id="image-file" name="image" accept="image/*" class="hidden">
                    </div>
                </div>

                <button class="w-full bg-primary text-white font-bold py-4 rounded-lg shadow hover:opacity-90 transition-all flex items-center justify-center gap-2" type="submit">
                    <span class="material-symbols-outlined">save</span> บันทึกข้อมูลเข้า Google Sheet
                </button>
            </form>
        </div>

        <!-- 📊 หน้าที่ 2: สรุปผล (Dashboard เรียบลื่นดึงข้อมูลจริง
